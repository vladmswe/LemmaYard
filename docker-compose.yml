services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leetcopy
      POSTGRES_PASSWORD: leetcopy
      POSTGRES_DB: leetcopy
    ports:
      - "5433:5432" # host 5433 to avoid clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcopy -d leetcopy"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
